name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m compileall -q src
      - run: pip-audit .
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Scaffold a project and render its chart
        shell: bash
        run: |
          destination="$(mktemp -d)"
          python -m launchpad init check-example --repository sample/check-example --output-parent "$destination"
          python -m launchpad check "$destination/check-example"
          chart="$destination/check-example/deploy/chart"
          chart_hash="$(sha256sum "$chart/Chart.yaml" | cut -d ' ' -f 1)"
          helm lint "$chart" --set-string "image.digest=sha256:${chart_hash}"
          python -m launchpad render "$destination/check-example" --digest "sha256:${chart_hash}" > /dev/null
