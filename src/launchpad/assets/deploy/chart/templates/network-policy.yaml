{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "launchpad.name" . }}
  labels:
    {{- include "launchpad.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "launchpad.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              launchpad.dev/access: {{ include "launchpad.name" . }}
      ports:
        - protocol: TCP
          port: 8000
  egress: []
{{- end }}
