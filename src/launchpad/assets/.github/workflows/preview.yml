name: Preview

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy or remove the pull request preview
        required: true
        type: choice
        options: [deploy, destroy]
      pull_request_number:
        description: Pull request that owns this preview namespace
        required: true
        type: string
      image_digest:
        description: Published GHCR digest, for example sha256:<64 lowercase hex characters>
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.repository.full_name }}-${{ inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Deploy isolated preview
        if: inputs.operation == 'deploy'
        id: deploy
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        run: python scripts/preview.py deploy --pull-request "$PULL_REQUEST_NUMBER" --digest "$IMAGE_DIGEST"
      - name: Remove preview namespace
        if: inputs.operation == 'destroy'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        run: python scripts/preview.py destroy --pull-request "$PULL_REQUEST_NUMBER"
